<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sketch</title>
    <!-- Add Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="dot.png" />

    <!-- Custom CSS for toolbar hover effect -->
    <style>
      #controls {
        bottom: -104px;
        transform: translateY(0);
        transition: transform 0.3s ease-in-out;
      }

      #controls:hover {
        transform: translateY(-104px);
      }
    </style>
  </head>

  <body
    class="bg-[#F5F5F5] text-[#1C1C1CBF]"
    style="
      background-image: radial-gradient(
        circle at 8px 8px,
        #1c1c1c30 1px,
        transparent 0
      );
      background-size: 16px 16px;
    "
  >
    <div id="controls" class="bg-white/80 fixed left-0">
      <!-- Size and Color Controls -->
      <div class="flex border-t border-r border-b border-gray-300">
        <button
          id="size-button"
          class="relative w-16 h-16 flex items-center justify-center"
        >
          <div
            id="size-indicator"
            class="bg-current rounded-full transition-all duration-800"
            style="width: 5px; height: 5px"
          ></div>
        </button>
        <button
          class="flex-1 active relative"
          style="background-color: #262626"
          data-color="#262626"
        >
          <div
            class="absolute w-2 h-2 bg-white/10 rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-0"
          ></div>
        </button>

        <button
          class="flex-1 relative"
          style="background-color: #c3c3c3"
          data-color="#c3c3c3"
        >
          <div
            class="absolute w-2 h-2 bg-black/10 rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-0"
          ></div>
        </button>
        <button
          class="flex-1 relative"
          style="background-color: #f7eb0e"
          data-color="#fde924"
        >
          <div
            class="absolute w-2 h-2 bg-black/10 rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-0"
          ></div>
        </button>
        <button
          class="flex-1 relative"
          style="background-color: #ff7f9f"
          data-color="#ff7f9f"
        >
          <div
            class="absolute w-2 h-2 bg-black/10 rounded-full top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-0"
          ></div>
        </button>
      </div>

      <!-- Action Controls -->
      <div
        class="flex gap-8 py-5 justify-between items-center px-4 border-r border-gray-300"
      >
        <button id="undo" title="Undo">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4 10H17C19.2091 10 21 11.7909 21 14C21 16.2091 19.2091 18 17 18H12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 6L3 10L7 14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="redo" title="Redo">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M20 10H7C4.79086 10 3 11.7909 3 14C3 16.2091 4.79086 18 7 18H12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M17 6L21 10L17 14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="clear" title="Clear">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M3 6H21"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M19 6V20C19 21.1046 18.1046 22 17 22H7C5.89543 22 5 21.1046 5 20V6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M8 6V4C8 2.89543 8.89543 2 10 2H14C15.1046 2 16 2.89543 16 4V6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button id="download" title="download">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 10L12 15L17 10"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 15V3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const undoButton = document.getElementById("undo");
      const redoButton = document.getElementById("redo");

      let currentSize = 10;
      let currentColor = "#262626";
      let isDrawing = false;
      let isStraightLineMode = false;
      let paths = [];
      let undonePaths = [];
      let currentPath = [];
      let straightLineStart = null;

      // Load saved data from localStorage
      function loadFromLocalStorage() {
        const savedPaths = localStorage.getItem("drawingPaths");
        const savedUndonePaths = localStorage.getItem("drawingUndonePaths");

        if (savedPaths) {
          paths = JSON.parse(savedPaths);
        }
        if (savedUndonePaths) {
          undonePaths = JSON.parse(savedUndonePaths);
        }

        redrawCanvas();
      }

      // Save current state to localStorage
      function saveToLocalStorage() {
        localStorage.setItem("drawingPaths", JSON.stringify(paths));
        localStorage.setItem("drawingUndonePaths", JSON.stringify(undonePaths));
      }

      // Replace size buttons setup with new cycling logic
      const sizeButton = document.getElementById("size-button");
      const sizeIndicator = document.getElementById("size-indicator");
      const sizes = [5, 8, 13, 18];
      let currentSizeIndex = 1; // Start with Regular (8)
      currentSize = sizes[currentSizeIndex];

      // Update size indicator
      function updateSizeIndicator() {
        sizeIndicator.style.width = sizes[currentSizeIndex] + "px";
        sizeIndicator.style.height = sizes[currentSizeIndex] + "px";
      }

      // Initialize size indicator
      updateSizeIndicator();

      // Handle size button clicks
      sizeButton.addEventListener("click", () => {
        currentSizeIndex = (currentSizeIndex + 1) % sizes.length;
        currentSize = sizes[currentSizeIndex];
        updateSizeIndicator();
      });

      // Set up color buttons
      document.querySelectorAll("[data-color]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          document.querySelectorAll("[data-color]").forEach((b) => {
            b.classList.remove("active");
            b.querySelector("div").classList.add("opacity-0");
          });
          btn.classList.add("active");
          btn.querySelector("div").classList.remove("opacity-0");
          currentColor = btn.dataset.color;
        });
      });

      // Initialize active color button on page load
      const activeColorButton = document.querySelector("[data-color].active");
      if (activeColorButton) {
        currentColor = activeColorButton.dataset.color;
        activeColorButton.querySelector("div").classList.remove("opacity-0");
      }

      // Set canvas size to window size and redraw content
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        redrawCanvas();
      }

      // Initial resize and add resize listener
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      // Drawing functions
      function startDrawing(e) {
        isDrawing = true;
        undonePaths = [];

        if (isStraightLineMode) {
          // For straight lines, just store the start point
          straightLineStart = {
            x: e.offsetX,
            y: e.offsetY,
            size: currentSize,
            color: currentColor,
          };
          currentPath = [straightLineStart];
        } else {
          // For normal drawing, start with the first point
          currentPath = [
            {
              x: e.offsetX,
              y: e.offsetY,
              size: currentSize,
              color: currentColor,
            },
          ];
          draw(e);
        }
      }

      function draw(e) {
        if (!isDrawing) return;

        if (isStraightLineMode) {
          // For straight lines, clear canvas and redraw everything, then draw preview line
          redrawCanvas();

          // Draw preview line from start to current mouse position
          if (straightLineStart) {
            ctx.beginPath();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.setLineDash([5, 5]); // Dashed line for preview
            ctx.moveTo(straightLineStart.x, straightLineStart.y);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash
          }
        } else {
          // Normal drawing with smooth curves
          const newPoint = {
            x: e.offsetX,
            y: e.offsetY,
            size: currentSize,
            color: currentColor,
          };

          currentPath.push(newPoint);

          // Draw smooth curves
          if (currentPath.length >= 2) {
            ctx.beginPath();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;

            if (currentPath.length === 2) {
              // For the first segment, just draw a line
              const prevPoint = currentPath[currentPath.length - 2];
              const currentPoint = currentPath[currentPath.length - 1];
              ctx.moveTo(prevPoint.x, prevPoint.y);
              ctx.lineTo(currentPoint.x, currentPoint.y);
            } else {
              // For subsequent segments, use quadratic curves for smoothness
              const prevPoint = currentPath[currentPath.length - 3];
              const currentPoint = currentPath[currentPath.length - 2];
              const nextPoint = currentPath[currentPath.length - 1];

              // Calculate control point for smooth curve
              const cp1x = (prevPoint.x + currentPoint.x) / 2;
              const cp1y = (prevPoint.y + currentPoint.y) / 2;
              const cp2x = (currentPoint.x + nextPoint.x) / 2;
              const cp2y = (currentPoint.y + nextPoint.y) / 2;

              ctx.moveTo(cp1x, cp1y);
              ctx.quadraticCurveTo(currentPoint.x, currentPoint.y, cp2x, cp2y);
            }
            ctx.stroke();
          }
        }
      }

      function stopDrawing() {
        if (isDrawing) {
          if (isStraightLineMode && straightLineStart) {
            // For straight lines, create a path with just start and end points
            const endPoint = {
              x: event.offsetX || straightLineStart.x,
              y: event.offsetY || straightLineStart.y,
              size: currentSize,
              color: currentColor,
            };
            currentPath = [straightLineStart, endPoint];
          }
          paths.push([...currentPath]);
          currentPath = [];
          straightLineStart = null;

          // Redraw canvas to show the solid line immediately
          redrawCanvas();
          saveToLocalStorage();
        }
        isDrawing = false;
      }

      function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        paths.forEach((path) => {
          if (path.length < 2) return;

          // Draw smooth curves for the entire path
          ctx.beginPath();
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = path[0].color;
          ctx.lineWidth = path[0].size;

          if (path.length === 2) {
            // For single segment, just draw a line
            ctx.moveTo(path[0].x, path[0].y);
            ctx.lineTo(path[1].x, path[1].y);
          } else {
            // For multiple segments, use smooth curves
            ctx.moveTo(path[0].x, path[0].y);

            for (let i = 1; i < path.length - 1; i++) {
              const prevPoint = path[i - 1];
              const currentPoint = path[i];
              const nextPoint = path[i + 1];

              // Calculate control points for smooth curve
              const cp1x = (prevPoint.x + currentPoint.x) / 2;
              const cp1y = (prevPoint.y + currentPoint.y) / 2;
              const cp2x = (currentPoint.x + nextPoint.x) / 2;
              const cp2y = (currentPoint.y + nextPoint.y) / 2;

              ctx.quadraticCurveTo(currentPoint.x, currentPoint.y, cp2x, cp2y);
            }
          }
          ctx.stroke();
        });
      }

      // Modify undo function to store undone paths
      function undo() {
        const removedPath = paths.pop();
        if (removedPath) {
          undonePaths.push(removedPath);
          redrawCanvas();
          saveToLocalStorage();
        }
      }

      // Add redo function
      function redo() {
        const pathToRestore = undonePaths.pop();
        if (pathToRestore) {
          // Check if this is a clear operation (array of arrays) or single path
          if (
            Array.isArray(pathToRestore) &&
            pathToRestore.length > 0 &&
            Array.isArray(pathToRestore[0])
          ) {
            // This is a clear operation - restore all paths
            paths = [...pathToRestore];
          } else {
            // This is a single path
            paths.push(pathToRestore);
          }
          redrawCanvas();
          saveToLocalStorage();
        }
      }

      // Add save functionality
      document
        .getElementById("download")
        .addEventListener("click", function () {
          // Create a temporary canvas to include the background
          const tempCanvas = document.createElement("canvas");
          tempCanvas.width = canvas.width;
          tempCanvas.height = canvas.height;
          const tempCtx = tempCanvas.getContext("2d");

          // Fill background
          tempCtx.fillStyle = "#D0CAC6";
          tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

          // Draw the original canvas content
          tempCtx.drawImage(canvas, 0, 0);

          // Create formatted date string
          const now = new Date();
          const date = now
            .toLocaleString("en-GB", {
              year: "2-digit",
              month: "2-digit",
              day: "2-digit",
            })
            .replace(/\//g, "");
          const time = now
            .toLocaleString("en-GB", {
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            })
            .replace(":", "");

          // Create a temporary link element
          const link = document.createElement("a");
          link.download = `Sketch-${date}-${time}.png`;
          link.href = tempCanvas.toDataURL("image/png");
          link.click();
        });

      // Add clear functionality that can be undone
      function clearCanvas() {
        // Only clear if there are paths to clear
        if (paths.length > 0) {
          // Save current state to undo stack before clearing
          const currentPaths = [...paths];
          undonePaths = [currentPaths]; // Save all current paths as one undo action
          paths = [];
          redrawCanvas();
          saveToLocalStorage();
        }
      }

      document.getElementById("clear").addEventListener("click", clearCanvas);

      // Event listeners
      canvas.addEventListener("mousedown", startDrawing);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", stopDrawing);
      canvas.addEventListener("mouseout", stopDrawing);

      // Add touch support
      canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent("mousedown", {
          clientX: touch.clientX,
          clientY: touch.clientY,
        });
        canvas.dispatchEvent(mouseEvent);
      });

      canvas.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent("mousemove", {
          clientX: touch.clientX,
          clientY: touch.clientY,
        });
        canvas.dispatchEvent(mouseEvent);
      });

      canvas.addEventListener("touchend", (e) => {
        e.preventDefault();
        const mouseEvent = new MouseEvent("mouseup", {});
        canvas.dispatchEvent(mouseEvent);
      });
      undoButton.addEventListener("click", undo);
      redoButton.addEventListener("click", redo);

      // Load saved data when page loads
      window.addEventListener("load", loadFromLocalStorage);

      // Handle keyup events for straight line mode
      document.addEventListener("keyup", function (e) {
        if (e.key === "Meta" || e.key === "Control") {
          isStraightLineMode = false;
        }
      });

      // Modify keyboard shortcuts
      document.addEventListener("keydown", function (e) {
        // Cmd/Ctrl key for straight line mode
        if (e.metaKey || e.ctrlKey) {
          isStraightLineMode = true;
        }

        // Number keys 1-4 for colors
        if (e.key >= "1" && e.key <= "4") {
          const index = parseInt(e.key) - 1;
          const colorButtons = document.querySelectorAll("[data-color]");
          if (colorButtons[index]) {
            colorButtons.forEach((b) => {
              b.classList.remove("active");
              b.querySelector("div").classList.add("opacity-0");
            });
            colorButtons[index].classList.add("active");
            colorButtons[index]
              .querySelector("div")
              .classList.remove("opacity-0");
            currentColor = colorButtons[index].dataset.color;
          }
        }

        // Up and down arrows for brush size
        if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          if (e.key === "ArrowUp") {
            currentSizeIndex = (currentSizeIndex + 1) % sizes.length;
          } else {
            currentSizeIndex =
              (currentSizeIndex - 1 + sizes.length) % sizes.length;
          }
          currentSize = sizes[currentSizeIndex];
          updateSizeIndicator();
        }

        // Backspace for clear
        if (e.key === "Backspace") {
          clearCanvas();
        }

        // Left arrow for undo, right arrow for redo
        if (e.key === "ArrowLeft") {
          undo();
        }
        if (e.key === "ArrowRight") {
          redo();
        }
      });
    </script>
  </body>
</html>
